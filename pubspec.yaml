name: xue_hua_animated_svg
description: >-
  Pure Dart animated SVG for Flutter: SMIL/CSS precompiled to a typed AST, 60/120fps paint with static subtree Picture caching, zero native deps.
version: 1.1.0
repository: https://github.com/Matkurban/xue_hua_animated_svg
homepage: https://github.com/Matkurban/xue_hua_animated_svg
issue_tracker: https://github.com/Matkurban/xue_hua_animated_svg/issues

topics:
  - svg
  - animation
  - flutter
  - smil
  - vector-graphics

screenshots:
  - description: CyberCore composite demo — gradients, morph, orbit motion.
    path: screenshots/render_cybercore.gif
  - description: Elephant outline with rotating animateTransform accent.
    path: screenshots/render_elephant.gif
  - description: Breathing circle — SMIL radius and opacity pulse.
    path: screenshots/render_breathing.gif
  - description: Orbit probe along an animateMotion path.
    path: screenshots/render_orbit.gif
  - description: CSS @keyframes rotating ring.
    path: screenshots/render_css_ring.gif
  - description: Path morph between polygon and star.
    path: screenshots/render_morph.gif

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
