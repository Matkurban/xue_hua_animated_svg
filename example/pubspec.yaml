name: example
description: "Animated SVG Engine showcase application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.4
  flex_color_scheme: ^9.0.0
  material_ui: ^1.8.0
  xue_hua_animated_svg:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/
