<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- SMIL <animateTransform>: rotate + scale -->
  <rect x="20" y="20" width="160" height="160" rx="24" fill="#0F172A"/>
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="4s" repeatCount="indefinite"/>
    <rect x="60" y="60" width="80" height="80" rx="14" fill="#38BDF8">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1.15 1.15;1 1" dur="2s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </rect>
  </g>
</svg>
