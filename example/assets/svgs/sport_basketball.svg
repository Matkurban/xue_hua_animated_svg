<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Shadow scaling on floor -->
  <ellipse cx="100" cy="170" rx="35" ry="8" fill="#000000" opacity="0.4">
    <animate attributeName="rx" values="45;20;45" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Bouncing Ball -->
  <g transform-origin="100 130">
    <animateTransform attributeName="transform" type="translate" values="0 35; 0 -45; 0 35" dur="1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.2 0 0.8 0.4;0.2 0.6 0.8 1"/>
    <!-- Squash and Stretch on bounce -->
    <g transform-origin="100 100">
      <animateTransform attributeName="transform" type="scale" values="1.2 0.8; 0.95 1.05; 1.2 0.8" dur="1s" repeatCount="indefinite"/>
      <!-- Ball Body -->
      <circle cx="100" cy="100" r="42" fill="#EA580C"/>
      <!-- Seams -->
      <line x1="100" y1="58" x2="100" y2="142" stroke="#18181B" stroke-width="3"/>
      <line x1="58" y1="100" x2="142" y2="100" stroke="#18181B" stroke-width="3"/>
      <path d="M 70 70 C 85 85, 85 115, 70 130" fill="none" stroke="#18181B" stroke-width="3"/>
      <path d="M 130 70 C 115 85, 115 115, 130 130" fill="none" stroke="#18181B" stroke-width="3"/>
    </g>
  </g>
</svg>
