<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#082F49"/>
  <!-- Falling drop -->
  <path d="M 100 45 C 92 60, 90 70, 100 78 C 110 70, 108 60, 100 45 Z" fill="#38BDF8">
    <animateTransform attributeName="transform" type="translate" values="0 -20; 0 65" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.6;1" keySplines="0.7 0 0.84 0;0 0 1 1"/>
    <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.55; 0.6; 1" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Ripples -->
  <ellipse cx="100" cy="140" rx="15" ry="6" fill="none" stroke="#38BDF8" stroke-width="3">
    <animate attributeName="rx" values="5;70" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="2;25" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="140" rx="15" ry="6" fill="none" stroke="#7DD3FC" stroke-width="2.5">
    <animate attributeName="rx" values="5;55" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="2;20" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
