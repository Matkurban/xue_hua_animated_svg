<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#2E0814"/>
  <!-- Expanding Aura -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#F43F5E" stroke-width="3" opacity="0.6">
    <animate attributeName="r" values="35;65" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Heart Pulsing -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="scale" values="0.9; 1.15; 0.95; 1.25; 0.9" keyTimes="0; 0.2; 0.35; 0.55; 1" dur="1.2s" repeatCount="indefinite"/>
    <path d="M 100 140 C 65 110, 45 85, 55 65 C 65 45, 90 50, 100 70 C 110 50, 135 45, 145 65 C 155 85, 135 110, 100 140 Z" fill="#E11D48"/>
  </g>
</svg>
