<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#064E3B"/>
  <!-- Front Wheel Spinning -->
  <g transform-origin="145 130">
    <animateTransform attributeName="transform" type="rotate" from="0 145 130" to="360 145 130" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="145" cy="130" r="28" fill="none" stroke="#E2E8F0" stroke-width="4"/>
    <line x1="145" y1="102" x2="145" y2="158" stroke="#94A3B8" stroke-width="2"/>
    <line x1="117" y1="130" x2="173" y2="130" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="145" cy="130" r="4" fill="#10B981"/>
  </g>
  <!-- Rear Wheel Spinning -->
  <g transform-origin="55 130">
    <animateTransform attributeName="transform" type="rotate" from="0 55 130" to="360 55 130" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="55" cy="130" r="28" fill="none" stroke="#E2E8F0" stroke-width="4"/>
    <line x1="55" y1="102" x2="55" y2="158" stroke="#94A3B8" stroke-width="2"/>
    <line x1="27" y1="130" x2="83" y2="130" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="55" cy="130" r="4" fill="#10B981"/>
  </g>
  <!-- Frame -->
  <polygon points="55,130 95,130 125,85 85,85" fill="none" stroke="#34D399" stroke-width="5" stroke-linejoin="round"/>
  <line x1="95" y1="130" x2="85" y2="85" stroke="#34D399" stroke-width="5"/>
  <line x1="145" y1="130" x2="125" y2="85" stroke="#34D399" stroke-width="5"/>
  <!-- Handlebars & Seat -->
  <line x1="120" y1="75" x2="132" y2="75" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
  <line x1="78" y1="80" x2="92" y2="80" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
</svg>
