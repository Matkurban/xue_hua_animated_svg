<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#2E1065"/>
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" values="0 -6; 0 6; 0 -6" dur="1.8s" repeatCount="indefinite"/>
    <!-- Left Wing Flapping -->
    <g transform-origin="100 100">
      <animateTransform attributeName="transform" type="scale" values="1 1; 0.3 1; 1 1" dur="0.6s" repeatCount="indefinite"/>
      <path d="M 100 95 C 70 40, 30 60, 45 100 C 35 130, 80 145, 100 110 Z" fill="#EC4899"/>
      <circle cx="65" cy="90" r="10" fill="#FDE047"/>
    </g>
    <!-- Right Wing Flapping -->
    <g transform-origin="100 100">
      <animateTransform attributeName="transform" type="scale" values="1 1; 0.3 1; 1 1" dur="0.6s" repeatCount="indefinite"/>
      <path d="M 100 95 C 130 40, 170 60, 155 100 C 165 130, 120 145, 100 110 Z" fill="#8B5CF6"/>
      <circle cx="135" cy="90" r="10" fill="#FDE047"/>
    </g>
    <!-- Butterfly Body -->
    <ellipse cx="100" cy="102" rx="4" ry="22" fill="#0F172A"/>
    <!-- Antennae -->
    <path d="M 98 82 Q 90 70, 85 68" fill="none" stroke="#F8FAFC" stroke-width="2"/>
    <path d="M 102 82 Q 110 70, 115 68" fill="none" stroke="#F8FAFC" stroke-width="2"/>
  </g>
</svg>
