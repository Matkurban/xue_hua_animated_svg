<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#090514"/>
  <!-- Outer Ring Layer CW -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
    <circle cx="100" cy="40" r="18" fill="none" stroke="#C084FC" stroke-width="4"/>
    <circle cx="100" cy="160" r="18" fill="none" stroke="#C084FC" stroke-width="4"/>
    <circle cx="40" cy="100" r="18" fill="none" stroke="#C084FC" stroke-width="4"/>
    <circle cx="160" cy="100" r="18" fill="none" stroke="#C084FC" stroke-width="4"/>
  </g>
  <!-- Middle Ring Layer CCW -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="8s" repeatCount="indefinite"/>
    <polygon points="100,55 120,80 145,100 120,120 100,145 80,120 55,100 80,80" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <polygon points="100,65 135,100 100,135 65,100" fill="none" stroke="#F43F5E" stroke-width="3"/>
  </g>
  <!-- Core Star -->
  <circle cx="100" cy="100" r="12" fill="#FDE047"/>
</svg>
