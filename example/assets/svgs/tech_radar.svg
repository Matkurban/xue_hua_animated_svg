<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#022C22"/>
  <!-- Radar circles -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#059669" stroke-width="2"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#059669" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#059669" stroke-width="1.5"/>
  <!-- Crosshairs -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="#059669" stroke-width="1.5"/>
  <line x1="100" y1="30" x2="100" y2="170" stroke="#059669" stroke-width="1.5"/>
  <!-- Rotating Sweep line -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite"/>
    <line x1="100" y1="100" x2="170" y2="100" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Blip Target -->
  <circle cx="130" cy="80" r="5" fill="#FACC15">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
