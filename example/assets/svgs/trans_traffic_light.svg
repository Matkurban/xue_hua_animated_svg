<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <!-- Post & Box Housing -->
  <rect x="70" y="30" width="60" height="140" rx="16" fill="#27272A" stroke="#52525B" stroke-width="4"/>
  <!-- Red Light -->
  <circle cx="100" cy="58" r="16" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.2;0.2;1" keyTimes="0;0.35;0.7;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Yellow Light -->
  <circle cx="100" cy="100" r="16" fill="#FACC15">
    <animate attributeName="opacity" values="0.2;1;0.2;0.2" keyTimes="0;0.35;0.7;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Green Light -->
  <circle cx="100" cy="142" r="16" fill="#22C55E">
    <animate attributeName="opacity" values="0.2;0.2;1;0.2" keyTimes="0;0.35;0.7;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
