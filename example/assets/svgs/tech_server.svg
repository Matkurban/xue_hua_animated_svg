<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Server Unit 1 -->
  <rect x="40" y="42" width="120" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <circle cx="56" cy="58" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="58" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
  </circle>
  <!-- Server Unit 2 -->
  <rect x="40" y="84" width="120" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <circle cx="56" cy="100" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="100" r="4" fill="#FACC15">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Server Unit 3 -->
  <rect x="40" y="126" width="120" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <circle cx="56" cy="142" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="142" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
