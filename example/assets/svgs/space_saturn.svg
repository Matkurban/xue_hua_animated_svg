<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="saturnBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0B132B"/>
  <!-- Background Ring half -->
  <g transform="rotate(-20, 100, 100)">
    <ellipse cx="100" cy="100" rx="75" ry="18" fill="none" stroke="#FDE68A" stroke-width="8" opacity="0.6"/>
  </g>
  <!-- Planet Sphere -->
  <circle cx="100" cy="100" r="38" fill="url(#saturnBody)"/>
  <!-- Foreground Ring half -->
  <g transform="rotate(-20, 100, 100)">
    <path d="M 25 100 A 75 18 0 0 0 175 100" fill="none" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
    <path d="M 35 100 A 65 14 0 0 0 165 100" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Small orbiting moon -->
  <circle cx="100" cy="40" r="4" fill="#93C5FD">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
