<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#1C1917"/>
  <!-- Fire logs -->
  <line x1="50" y1="165" x2="150" y2="145" stroke="#78350F" stroke-width="12" stroke-linecap="round"/>
  <line x1="50" y1="145" x2="150" y2="165" stroke="#9A3412" stroke-width="12" stroke-linecap="round"/>
  <!-- Outer red flame -->
  <path d="M 100 45 C 130 90, 145 130, 130 155 C 115 165, 85 165, 70 155 C 55 130, 70 90, 100 45 Z" fill="#DC2626" opacity="0.8">
    <animateTransform attributeName="transform" type="scale" values="1 0.95; 1 1.05; 1 0.95" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- Middle orange flame -->
  <path d="M 100 70 C 120 100, 130 130, 120 152 C 110 160, 90 160, 80 152 C 70 130, 80 100, 100 70 Z" fill="#F97316">
    <animateTransform attributeName="transform" type="scale" values="0.95 1.05; 1.05 0.95; 0.95 1.05" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <!-- Inner yellow flame -->
  <path d="M 100 95 C 112 115, 118 135, 112 150 C 105 155, 95 155, 88 150 C 82 135, 88 115, 100 95 Z" fill="#FDE047">
    <animateTransform attributeName="transform" type="scale" values="1 0.9; 1 1.1; 1 0.9" dur="0.7s" repeatCount="indefinite"/>
  </path>
</svg>
