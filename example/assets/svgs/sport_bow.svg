<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Bow Stave bending -->
  <path d="M 60 40 Q 130 100, 60 160" fill="none" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
  <!-- Bowstring pulled back -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.7;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <polyline points="60,40 85,100 60,160" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <!-- Arrow pulled back -->
    <line x1="85" y1="100" x2="155" y2="100" stroke="#94A3B8" stroke-width="4"/>
    <polygon points="155,95 170,100 155,105" fill="#EF4444"/>
    <polygon points="90,95 85,100 90,105" fill="#FACC15"/>
  </g>
</svg>
