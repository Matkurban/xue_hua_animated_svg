<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#000000"/>
  <!-- Accretion disk spinning -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="100" rx="80" ry="24" fill="none" stroke="#F97316" stroke-width="10" stroke-dasharray="70 40" opacity="0.8"/>
    <ellipse cx="100" cy="100" rx="65" ry="18" fill="none" stroke="#FACC15" stroke-width="8" stroke-dasharray="50 30" opacity="0.9"/>
    <ellipse cx="100" cy="100" rx="50" ry="14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="30 20"/>
  </g>
  <!-- Event Horizon (Black Void) -->
  <circle cx="100" cy="100" r="32" fill="#000000"/>
  <circle cx="100" cy="100" r="32" fill="none" stroke="#A855F7" stroke-width="2.5" opacity="0.8"/>
</svg>
