<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <!-- Top Push Buttons -->
  <rect x="94" y="25" width="12" height="15" rx="2" fill="#94A3B8"/>
  <rect x="88" y="20" width="24" height="8" rx="3" fill="#64748B"/>
  <rect x="135" y="38" width="10" height="14" rx="2" fill="#94A3B8" transform="rotate(35, 140, 45)"/>
  <!-- Stopwatch Body -->
  <circle cx="100" cy="110" r="62" fill="#27272A" stroke="#475569" stroke-width="6"/>
  <circle cx="100" cy="110" r="50" fill="#09090B"/>
  <!-- Ticks -->
  <line x1="100" y1="65" x2="100" y2="72" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="145" y1="110" x2="138" y2="110" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="100" y1="155" x2="100" y2="148" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="55" y1="110" x2="62" y2="110" stroke="#E2E8F0" stroke-width="3"/>
  <!-- Sweeping Hand -->
  <g transform-origin="100 110">
    <animateTransform attributeName="transform" type="rotate" from="0 100 110" to="360 100 110" dur="2s" repeatCount="indefinite"/>
    <line x1="100" y1="110" x2="100" y2="72" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="110" r="4" fill="#EF4444"/>
  </g>
</svg>
