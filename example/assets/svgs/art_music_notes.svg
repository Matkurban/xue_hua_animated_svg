<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <!-- Staff Lines -->
  <line x1="20" y1="65" x2="180" y2="65" stroke="#3F3F46" stroke-width="1.5"/>
  <line x1="20" y1="82" x2="180" y2="82" stroke="#3F3F46" stroke-width="1.5"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#3F3F46" stroke-width="1.5"/>
  <line x1="20" y1="118" x2="180" y2="118" stroke="#3F3F46" stroke-width="1.5"/>
  <line x1="20" y1="135" x2="180" y2="135" stroke="#3F3F46" stroke-width="1.5"/>
  <!-- Treble Clef -->
  <circle cx="55" cy="115" r="10" fill="#FACC15"/>
  <line x1="65" y1="115" x2="65" y2="60" stroke="#FACC15" stroke-width="4" stroke-linecap="round"/>
  <!-- Floating Eighth Note 1 -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" values="0 15; 0 -25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="100" rx="8" ry="6" fill="#EC4899"/>
    <line x1="108" y1="100" x2="108" y2="70" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M 108 70 Q 120 72, 122 80" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Floating Beam Note 2 -->
  <g transform-origin="140 90">
    <animateTransform attributeName="transform" type="translate" values="0 15; 0 -25" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    <ellipse cx="140" cy="90" rx="7" ry="5" fill="#38BDF8"/>
    <line x1="147" y1="90" x2="147" y2="65" stroke="#38BDF8" stroke-width="2.5"/>
  </g>
</svg>
