<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100; 0 100 100; 180 100 100; 180 100 100; 360 100 100" keyTimes="0;0.7;0.85;0.95;1" dur="4s" repeatCount="indefinite"/>
    <!-- Glass body -->
    <path d="M 65 45 L 135 45 L 105 95 L 105 105 L 135 155 L 65 155 L 95 105 L 95 95 Z" fill="none" stroke="#E2E8F0" stroke-width="5" stroke-linejoin="round"/>
    <!-- Caps -->
    <line x1="55" y1="45" x2="145" y2="45" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
    <line x1="55" y1="155" x2="145" y2="155" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
    <!-- Top sand draining -->
    <polygon points="75,55 125,55 100,90" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <!-- Sand trickle -->
    <line x1="100" y1="95" x2="100" y2="145" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom sand filling -->
    <polygon points="100,135 125,150 75,150" fill="#F59E0B"/>
  </g>
</svg>
