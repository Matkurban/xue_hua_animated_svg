<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#1E1B4B"/>
  <!-- Ribbons -->
  <polygon points="70,25 90,95 70,95 50,25" fill="#EF4444"/>
  <polygon points="130,25 110,95 130,95 150,25" fill="#3B82F6"/>
  <!-- Medal rocking -->
  <g transform-origin="100 125">
    <animateTransform attributeName="transform" type="rotate" values="-6 100 125; 6 100 125; -6 100 125" dur="2.8s" repeatCount="indefinite"/>
    <!-- Outer Gold Rim -->
    <circle cx="100" cy="125" r="42" fill="#FACC15" stroke="#EAB308" stroke-width="4"/>
    <!-- Inner Relief -->
    <circle cx="100" cy="125" r="32" fill="#FDE047"/>
    <!-- Star on medal -->
    <polygon points="100,105 106,118 120,120 109,129 113,142 100,135 87,142 91,129 80,120 94,118" fill="#CA8A04"/>
  </g>
</svg>
