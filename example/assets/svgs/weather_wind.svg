<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#042F2E"/>
  <!-- Wind line 1 -->
  <path d="M 30 75 Q 120 65, 145 90 A 15 15 0 1 1 135 105" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;100" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </path>
  <!-- Wind line 2 -->
  <path d="M 45 120 Q 110 115, 155 130 A 12 12 0 1 0 150 145" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;100" dur="3s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </path>
  <!-- Drifting Leaf -->
  <g transform="translate(100, 100)">
    <animateTransform attributeName="transform" type="translate" values="40 85; 160 80" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0; 180" dur="3s" additive="sum" repeatCount="indefinite"/>
    <path d="M 0 0 C 6 -8, 14 -8, 18 0 C 14 8, 6 8, 0 0 Z" fill="#34D399"/>
  </g>
</svg>
