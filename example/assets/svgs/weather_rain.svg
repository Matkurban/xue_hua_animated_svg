<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0B132B"/>
  <!-- Rain drops -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="125" x2="65" y2="145">
      <animateTransform attributeName="transform" type="translate" values="0 -25; 0 35" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="95" y1="125" x2="90" y2="145">
      <animateTransform attributeName="transform" type="translate" values="0 -25; 0 35" dur="1s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="125" x2="115" y2="145">
      <animateTransform attributeName="transform" type="translate" values="0 -25; 0 35" dur="1s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="145" y1="125" x2="140" y2="145">
      <animateTransform attributeName="transform" type="translate" values="0 -25; 0 35" dur="1s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.15s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- Cloud -->
  <g fill="#94A3B8">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 60 115 A 25 25 0 0 1 100 80 A 30 30 0 0 1 150 90 A 25 25 0 0 1 160 115 Z"/>
    <circle cx="75" cy="115" r="20" fill="#94A3B8"/>
    <circle cx="145" cy="115" r="20" fill="#94A3B8"/>
    <rect x="75" y="95" width="70" height="25" fill="#94A3B8"/>
  </g>
</svg>
