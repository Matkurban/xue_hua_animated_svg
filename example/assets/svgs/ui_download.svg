<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0C1B2A"/>
  <!-- Bouncing Arrow -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -10; 0 12; 0 -10" dur="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <line x1="100" y1="50" x2="100" y2="115" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    <polyline points="75,95 100,125 125,95" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Bottom Tray -->
  <path d="M 50 145 L 50 160 L 150 160 L 150 145" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Progress bar in tray -->
  <line x1="65" y1="160" x2="135" y2="160" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70">
    <animate attributeName="stroke-dashoffset" values="70;0;70" dur="2.4s" repeatCount="indefinite"/>
  </line>
</svg>
