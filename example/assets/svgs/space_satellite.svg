<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#020617"/>
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" values="-10 100 100; 10 100 100; -10 100 100" dur="6s" repeatCount="indefinite"/>
    <!-- Solar Panel Left -->
    <rect x="25" y="85" width="45" height="30" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
    <line x1="47" y1="85" x2="47" y2="115" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="25" y1="100" x2="70" y2="100" stroke="#60A5FA" stroke-width="1.5"/>
    <!-- Solar Panel Right -->
    <rect x="130" y="85" width="45" height="30" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
    <line x1="152" y1="85" x2="152" y2="115" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="130" y1="100" x2="175" y2="100" stroke="#60A5FA" stroke-width="1.5"/>
    <!-- Satellite Body -->
    <rect x="80" y="78" width="40" height="44" rx="6" fill="#E2E8F0"/>
    <rect x="88" y="86" width="24" height="28" rx="3" fill="#94A3B8"/>
    <!-- Dish Antenna -->
    <path d="M 85 60 Q 100 45, 115 60 Z" fill="#F8FAFC"/>
    <line x1="100" y1="52" x2="100" y2="78" stroke="#CBD5E1" stroke-width="2.5"/>
    <!-- Blinking Beacon -->
    <circle cx="100" cy="48" r="3.5" fill="#EF4444">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
