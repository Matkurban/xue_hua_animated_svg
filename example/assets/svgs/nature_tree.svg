<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#022C22"/>
  <!-- Trunk -->
  <path d="M 92 120 L 90 180 L 110 180 L 108 120 Z" fill="#78350F"/>
  <!-- Canopy shaking slightly -->
  <g transform-origin="100 110">
    <animateTransform attributeName="transform" type="rotate" values="-3 100 110; 3 100 110; -3 100 110" dur="3.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <circle cx="100" cy="80" r="35" fill="#15803D"/>
    <circle cx="75" cy="95" r="28" fill="#16A34A"/>
    <circle cx="125" cy="95" r="28" fill="#16A34A"/>
    <circle cx="100" cy="100" r="30" fill="#22C55E"/>
  </g>
</svg>
