<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="channelBoost" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="200">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.4" intercept="0.1" />
        <feFuncG type="linear" slope="0.6" intercept="0" />
        <feFuncB type="linear" slope="1.5" intercept="0.15" />
        <feFuncA type="identity" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#0F172A" />
  <rect x="44" y="46" width="96" height="90" rx="16" fill="#64748B" />
  <rect x="180" y="46" width="96" height="90" rx="16" fill="#64748B" filter="url(#channelBoost)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="92" y="92" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#FFFFFF">Base</text>
  <text x="228" y="92" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="14" fill="#FFFFFF">Boosted</text>
  <text x="160" y="174" text-anchor="middle" font-family="monospace" font-size="13" fill="#CBD5E1">
    &lt;feComponentTransfer&gt; feFuncR/G/B/A
  </text>
</svg>
