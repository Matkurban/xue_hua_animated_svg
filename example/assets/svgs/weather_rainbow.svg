<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0C2340"/>
  <g fill="none" stroke-linecap="round">
    <!-- Red arch -->
    <path d="M 40 145 A 60 60 0 0 1 160 145" stroke="#F43F5E" stroke-width="6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0;100" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Yellow arch -->
    <path d="M 46 145 A 54 54 0 0 1 154 145" stroke="#FBBF24" stroke-width="6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0;100" dur="4s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <!-- Green arch -->
    <path d="M 52 145 A 48 48 0 0 1 148 145" stroke="#10B981" stroke-width="6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0;100" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <!-- Blue arch -->
    <path d="M 58 145 A 42 42 0 0 1 142 145" stroke="#38BDF8" stroke-width="6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;0;100" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Left cloud -->
  <g fill="#E2E8F0">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="2.5s" repeatCount="indefinite"/>
    <circle cx="45" cy="145" r="16"/>
    <circle cx="62" cy="140" r="14"/>
    <circle cx="32" cy="148" r="10"/>
  </g>
  <!-- Right cloud -->
  <g fill="#E2E8F0">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3s" repeatCount="indefinite"/>
    <circle cx="155" cy="145" r="16"/>
    <circle cx="138" cy="140" r="14"/>
    <circle cx="168" cy="148" r="10"/>
  </g>
</svg>
