<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#1E1B4B" />
  <switch>
    <g requiredExtensions="urn:svg:custom-ext">
      <rect x="40" y="50" width="240" height="100" rx="16" fill="#EF4444" />
      <text x="160" y="100" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="22">UNREACHABLE</text>
    </g>
    <g systemLanguage="zz-ZZ">
      <rect x="40" y="50" width="240" height="100" rx="16" fill="#F59E0B" />
      <text x="160" y="100" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="22">UNMATCHED LANG</text>
    </g>
    <g>
      <rect x="40" y="50" width="240" height="100" rx="16" fill="#10B981">
        <animate attributeName="opacity" values="0.82;1;0.82" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="160" y="92" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ECFDF5">
        &lt;switch&gt; MATCHED
      </text>
      <text x="160" y="122" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#D1FAE5">
        Fallback branch selected
      </text>
    </g>
  </switch>
</svg>
