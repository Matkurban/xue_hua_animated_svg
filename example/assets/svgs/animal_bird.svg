<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#042F2E"/>
  <!-- Hummingbird hover bob -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" values="0 -4; 0 4; 0 -4" dur="1.2s" repeatCount="indefinite"/>
    <!-- Rapid Wing Beat -->
    <g transform-origin="100 90">
      <animateTransform attributeName="transform" type="rotate" values="-40 100 90; 40 100 90; -40 100 90" dur="0.12s" repeatCount="indefinite"/>
      <ellipse cx="100" cy="62" rx="8" ry="32" fill="#10B981" opacity="0.8"/>
    </g>
    <!-- Bird Body -->
    <ellipse cx="105" cy="105" rx="26" ry="18" fill="#059669"/>
    <!-- Head -->
    <circle cx="82" cy="92" r="14" fill="#10B981"/>
    <!-- Eye -->
    <circle cx="78" cy="90" r="2.5" fill="#0F172A"/>
    <!-- Long Needle Beak -->
    <line x1="72" y1="94" x2="35" y2="102" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tail Feathers -->
    <polygon points="128,105 160,118 152,128" fill="#047857"/>
  </g>
</svg>
