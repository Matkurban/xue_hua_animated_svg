<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#1E1B4B"/>
  <!-- Top Loop -->
  <circle cx="100" cy="50" r="8" fill="none" stroke="#FBBF24" stroke-width="4"/>
  <!-- Bell Swinging -->
  <g transform-origin="100 50">
    <animateTransform attributeName="transform" type="rotate" values="-18 100 50; 18 100 50; -18 100 50" dur="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Bell dome -->
    <path d="M 80 85 C 80 65, 120 65, 120 85 L 128 125 C 135 130, 138 135, 138 140 L 62 140 C 62 135, 65 130, 72 125 Z" fill="#FBBF24"/>
    <!-- Clapper ball -->
    <circle cx="100" cy="148" r="8" fill="#F59E0B"/>
  </g>
</svg>
