<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#022C22"/>
  <!-- Center beacon dot -->
  <circle cx="100" cy="150" r="8" fill="#10B981"/>
  <!-- Wave 1 -->
  <path d="M 75 125 A 35 35 0 0 1 125 125" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <!-- Wave 2 -->
  <path d="M 55 100 A 62 62 0 0 1 145 100" fill="none" stroke="#6EE7B7" stroke-width="6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </path>
  <!-- Wave 3 -->
  <path d="M 35 75 A 90 90 0 0 1 165 75" fill="none" stroke="#A7F3D0" stroke-width="6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
  </path>
</svg>
