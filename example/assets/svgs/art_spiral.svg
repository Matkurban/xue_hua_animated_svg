<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#030712"/>
  <!-- Spiral rotating -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="5s" repeatCount="indefinite"/>
    <!-- Concentric spiral arms -->
    <path d="M 100 100 A 10 10 0 0 1 110 100 A 20 20 0 0 1 90 100 A 30 30 0 0 1 120 100 A 40 40 0 0 1 80 100 A 50 50 0 0 1 130 100 A 60 60 0 0 1 70 100 A 70 70 0 0 1 140 100" fill="none" stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="5" fill="#F43F5E"/>
  </g>
</svg>
