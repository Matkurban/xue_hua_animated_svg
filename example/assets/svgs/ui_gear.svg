<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Large Gear (Rotate CW) -->
  <g transform-origin="80 80">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="6s" repeatCount="indefinite"/>
    <circle cx="80" cy="80" r="38" fill="#3B82F6"/>
    <!-- Teeth -->
    <rect x="74" y="34" width="12" height="12" rx="2" fill="#3B82F6"/>
    <rect x="74" y="114" width="12" height="12" rx="2" fill="#3B82F6"/>
    <rect x="34" y="74" width="12" height="12" rx="2" fill="#3B82F6"/>
    <rect x="114" y="74" width="12" height="12" rx="2" fill="#3B82F6"/>
    <circle cx="80" cy="80" r="16" fill="#0F172A"/>
  </g>
  <!-- Small Gear (Rotate CCW) -->
  <g transform-origin="135 135">
    <animateTransform attributeName="transform" type="rotate" from="360 135 135" to="0 135 135" dur="3.8s" repeatCount="indefinite"/>
    <circle cx="135" cy="135" r="24" fill="#06B6D4"/>
    <!-- Teeth -->
    <rect x="131" y="105" width="8" height="8" rx="1.5" fill="#06B6D4"/>
    <rect x="131" y="157" width="8" height="8" rx="1.5" fill="#06B6D4"/>
    <rect x="105" y="131" width="8" height="8" rx="1.5" fill="#06B6D4"/>
    <rect x="157" y="131" width="8" height="8" rx="1.5" fill="#06B6D4"/>
    <circle cx="135" cy="135" r="10" fill="#0F172A"/>
  </g>
</svg>
