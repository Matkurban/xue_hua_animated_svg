<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Camera Body -->
  <rect x="40" y="65" width="120" height="85" rx="14" fill="#334155" stroke="#64748B" stroke-width="3"/>
  <rect x="75" y="52" width="50" height="15" rx="4" fill="#475569"/>
  <!-- Strobe Flash -->
  <circle cx="60" cy="82" r="7" fill="#FACC15">
    <animate attributeName="opacity" values="0.1; 0.1; 1; 0.1" keyTimes="0; 0.7; 0.75; 1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Lens Zooming -->
  <g transform-origin="100 110">
    <animateTransform attributeName="transform" type="scale" values="0.95; 1.08; 0.95" dur="1.8s" repeatCount="indefinite"/>
    <circle cx="100" cy="110" r="32" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="100" cy="110" r="22" fill="#0284C7"/>
    <circle cx="94" cy="104" r="6" fill="#BAE6FD" opacity="0.8"/>
  </g>
</svg>
