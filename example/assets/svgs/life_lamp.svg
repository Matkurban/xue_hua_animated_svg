<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <!-- Light cone beam -->
  <polygon points="120,70 190,175 80,175" fill="#FEF08A" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <!-- Desk Base -->
  <ellipse cx="60" cy="170" rx="25" ry="8" fill="#64748B"/>
  <!-- Lamp Arm -->
  <line x1="60" y1="170" x2="75" y2="115" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <line x1="75" y1="115" x2="110" y2="75" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <!-- Lamp Shade rocking -->
  <g transform-origin="110 75">
    <animateTransform attributeName="transform" type="rotate" values="-8 110 75; 8 110 75; -8 110 75" dur="3s" repeatCount="indefinite"/>
    <path d="M 95 60 L 130 75 L 110 95 L 90 85 Z" fill="#F59E0B"/>
    <circle cx="120" cy="85" r="8" fill="#FDE047"/>
  </g>
</svg>
