<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0C1B2A"/>
  <!-- Ice Ground -->
  <ellipse cx="100" cy="175" rx="70" ry="12" fill="#38BDF8" opacity="0.4"/>
  <!-- Penguin Waddling -->
  <g transform-origin="100 160">
    <animateTransform attributeName="transform" type="rotate" values="-8 100 160; 8 100 160; -8 100 160" dur="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Feet -->
    <ellipse cx="85" cy="165" rx="10" ry="4" fill="#F59E0B"/>
    <ellipse cx="115" cy="165" rx="10" ry="4" fill="#F59E0B"/>
    <!-- Outer Body -->
    <ellipse cx="100" cy="115" rx="36" ry="48" fill="#0F172A"/>
    <!-- White Belly -->
    <ellipse cx="100" cy="120" rx="24" ry="38" fill="#F8FAFC"/>
    <!-- Eyes -->
    <circle cx="90" cy="85" r="4" fill="#0F172A"/>
    <circle cx="110" cy="85" r="4" fill="#0F172A"/>
    <!-- Orange Beak -->
    <polygon points="94,95 106,95 100,105" fill="#F97316"/>
    <!-- Flippers -->
    <ellipse cx="62" cy="118" rx="6" ry="20" fill="#0F172A"/>
    <ellipse cx="138" cy="118" rx="6" ry="20" fill="#0F172A"/>
  </g>
</svg>
