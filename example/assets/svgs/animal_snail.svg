<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#064E3B"/>
  <g transform-origin="100 135">
    <animateTransform attributeName="transform" type="translate" values="-4 0; 4 0; -4 0" dur="4s" repeatCount="indefinite"/>
    <!-- Body Foot creeping -->
    <path d="M 45 150 C 45 140, 155 140, 160 150 C 150 158, 55 158, 45 150 Z" fill="#FBBF24"/>
    <!-- Snail Head & Eyestalks -->
    <path d="M 145 142 L 160 115" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="115" r="3.5" fill="#18181B"/>
    <path d="M 148 142 L 168 120" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="168" cy="120" r="3.5" fill="#18181B"/>
    <!-- Spiral Shell bobbing -->
    <g transform-origin="95 125">
      <animateTransform attributeName="transform" type="rotate" values="-3 95 125; 3 95 125; -3 95 125" dur="2s" repeatCount="indefinite"/>
      <circle cx="95" cy="125" r="32" fill="#D97706"/>
      <!-- Spiral grooves -->
      <path d="M 95 125 A 12 12 0 0 1 107 125 A 22 22 0 0 1 85 140" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
