<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0B132B"/>
  <!-- Tripod Stand -->
  <line x1="100" y1="120" x2="60" y2="180" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="140" y2="180" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="100" y2="180" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="120" r="8" fill="#94A3B8"/>
  <!-- Telescope Barrel tilting -->
  <g transform-origin="100 120">
    <animateTransform attributeName="transform" type="rotate" values="-15 100 120; 15 100 120; -15 100 120" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Main Tube -->
    <rect x="75" y="60" width="18" height="70" rx="4" fill="#3B82F6" transform="rotate(35, 100, 120)"/>
    <rect x="72" y="45" width="24" height="20" rx="3" fill="#1D4ED8" transform="rotate(35, 100, 120)"/>
    <!-- Eyepiece -->
    <rect x="80" y="125" width="8" height="15" rx="2" fill="#CBD5E1" transform="rotate(35, 100, 120)"/>
  </g>
</svg>
