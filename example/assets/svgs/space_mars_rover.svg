<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#451A03"/>
  <!-- Mars ground -->
  <path d="M 0 170 Q 100 155, 200 170 L 200 200 L 0 200 Z" fill="#78350F"/>
  <!-- Chassis Body -->
  <rect x="60" y="115" width="80" height="26" rx="6" fill="#F8FAFC"/>
  <!-- Wheels -->
  <circle cx="55" cy="155" r="12" fill="#1E293B"/>
  <circle cx="55" cy="155" r="5" fill="#94A3B8"/>
  <circle cx="100" cy="155" r="12" fill="#1E293B"/>
  <circle cx="100" cy="155" r="5" fill="#94A3B8"/>
  <circle cx="145" cy="155" r="12" fill="#1E293B"/>
  <circle cx="145" cy="155" r="5" fill="#94A3B8"/>
  <!-- Suspension arms -->
  <line x1="75" y1="130" x2="55" y2="155" stroke="#94A3B8" stroke-width="3"/>
  <line x1="100" y1="130" x2="100" y2="155" stroke="#94A3B8" stroke-width="3"/>
  <line x1="125" y1="130" x2="145" y2="155" stroke="#94A3B8" stroke-width="3"/>
  <!-- Mast Camera panning -->
  <g transform-origin="75 90">
    <animateTransform attributeName="transform" type="rotate" values="-15 75 90; 15 75 90; -15 75 90" dur="3s" repeatCount="indefinite"/>
    <line x1="75" y1="115" x2="75" y2="75" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="65" y="65" width="22" height="14" rx="3" fill="#E2E8F0"/>
    <circle cx="72" cy="72" r="3.5" fill="#0284C7"/>
    <circle cx="80" cy="72" r="2.5" fill="#EF4444"/>
  </g>
</svg>
