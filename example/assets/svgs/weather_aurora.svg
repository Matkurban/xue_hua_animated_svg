<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#06B6D4;#8B5CF6;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#8B5CF6;#EC4899;#06B6D4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC4899;#10B981;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#030712"/>
  <!-- Aurora curtains -->
  <path d="M 10 50 Q 50 80, 100 45 T 190 60 L 190 120 Q 140 100, 90 130 T 10 110 Z" fill="url(#auroraGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 -10; 0 10; 0 -10" dur="5s" repeatCount="indefinite"/>
  </path>
  <!-- Mountains silhouette -->
  <polygon points="0,200 50,140 100,180 150,130 200,200" fill="#0B132B"/>
  <polygon points="45,140 50,140 54,148 40,148" fill="#E2E8F0"/>
  <polygon points="144,130 150,130 155,139 140,139" fill="#E2E8F0"/>
</svg>
