<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#030712"/>
  <!-- Floating Astronaut -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" values="0 -12; 0 12; 0 -12" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate" values="-5 100 100; 5 100 100; -5 100 100" dur="5s" additive="sum" repeatCount="indefinite"/>
    <!-- Backpack -->
    <rect x="70" y="70" width="60" height="60" rx="10" fill="#64748B"/>
    <!-- Limbs -->
    <rect x="62" y="90" width="16" height="40" rx="8" fill="#CBD5E1"/>
    <rect x="122" y="90" width="16" height="40" rx="8" fill="#CBD5E1"/>
    <rect x="78" y="125" width="18" height="35" rx="8" fill="#94A3B8"/>
    <rect x="104" y="125" width="18" height="35" rx="8" fill="#94A3B8"/>
    <!-- Helmet -->
    <circle cx="100" cy="75" r="28" fill="#F1F5F9"/>
    <!-- Golden Visor -->
    <ellipse cx="100" cy="75" rx="19" ry="14" fill="#F59E0B">
      <animate attributeName="fill" values="#F59E0B;#FBBF24;#F59E0B" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
