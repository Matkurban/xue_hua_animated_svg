<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <!-- Front Wheel -->
  <g transform-origin="145 145">
    <animateTransform attributeName="transform" type="rotate" from="0 145 145" to="360 145 145" dur="0.6s" repeatCount="indefinite"/>
    <circle cx="145" cy="145" r="16" fill="#27272A" stroke="#71717A" stroke-width="4"/>
    <circle cx="145" cy="145" r="5" fill="#E4E4E7"/>
  </g>
  <!-- Rear Wheel -->
  <g transform-origin="55 145">
    <animateTransform attributeName="transform" type="rotate" from="0 55 145" to="360 55 145" dur="0.6s" repeatCount="indefinite"/>
    <circle cx="55" cy="145" r="16" fill="#27272A" stroke="#71717A" stroke-width="4"/>
    <circle cx="55" cy="145" r="5" fill="#E4E4E7"/>
  </g>
  <!-- Chassis & Fairing bouncing -->
  <g transform-origin="100 130">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="0.3s" repeatCount="indefinite"/>
    <!-- Step-through footboard -->
    <rect x="75" y="138" width="45" height="10" rx="3" fill="#EAB308"/>
    <!-- Rear fender & seat -->
    <path d="M 45 142 C 45 120, 75 120, 85 120 L 85 138 Z" fill="#FACC15"/>
    <rect x="60" y="112" width="30" height="10" rx="4" fill="#18181B"/>
    <!-- Delivery Box -->
    <rect x="35" y="95" width="28" height="26" rx="4" fill="#22C55E"/>
    <!-- Handlebar Stem -->
    <line x1="120" y1="140" x2="135" y2="85" stroke="#71717A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="138" cy="85" r="6" fill="#FACC15"/>
  </g>
</svg>
