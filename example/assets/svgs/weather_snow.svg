<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0C1B2A"/>
  <!-- Snowflake 1 -->
  <g transform-origin="70 80">
    <animateTransform attributeName="transform" type="rotate" from="0 70 80" to="360 70 80" dur="6s" repeatCount="indefinite"/>
    <line x1="70" y1="65" x2="70" y2="95" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="57" y1="72" x2="83" y2="88" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="57" y1="88" x2="83" y2="72" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="80" r="2.5" fill="#38BDF8"/>
  </g>
  <!-- Snowflake 2 falling -->
  <g transform-origin="135 120">
    <animateTransform attributeName="transform" type="rotate" from="360 135 120" to="0 135 120" dur="8s" repeatCount="indefinite"/>
    <line x1="135" y1="102" x2="135" y2="138" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
    <line x1="119" y1="111" x2="151" y2="129" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
    <line x1="119" y1="129" x2="151" y2="111" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
    <circle cx="135" cy="120" r="3.5" fill="#38BDF8"/>
  </g>
  <!-- Small soft snow dots -->
  <circle cx="50" cy="140" r="3.5" fill="#BAE6FD" opacity="0.8">
    <animate attributeName="cy" values="120;170" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="60" r="2.5" fill="#BAE6FD" opacity="0.7">
    <animate attributeName="cy" values="40;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="150" r="4" fill="#BAE6FD" opacity="0.9">
    <animate attributeName="cy" values="130;180" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
