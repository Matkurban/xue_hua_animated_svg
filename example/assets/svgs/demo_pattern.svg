<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="diagStripes" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(35)">
      <rect x="0" y="0" width="20" height="20" fill="#1E293B" />
      <rect x="0" y="0" width="10" height="20" fill="#06B6D4" />
      <circle cx="15" cy="10" r="3" fill="#FDE047" />
    </pattern>
  </defs>
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#0F172A" />
  <rect x="34" y="34" width="120" height="110" rx="16" fill="url(#diagStripes)" stroke="#38BDF8" stroke-width="3" />
  <circle cx="228" cy="89" r="54" fill="url(#diagStripes)" stroke="#FDE047" stroke-width="3">
    <animate attributeName="r" values="46;56;46" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="160" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#CBD5E1">
    &lt;pattern&gt; repeating tile shader
  </text>
