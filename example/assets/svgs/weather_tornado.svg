<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#18181B"/>
  <g fill="none" stroke-linecap="round">
    <!-- Top ellipse ring -->
    <ellipse cx="100" cy="50" rx="55" ry="12" stroke="#94A3B8" stroke-width="5" stroke-dasharray="60 30">
      <animateTransform attributeName="transform" type="translate" values="-15 0; 15 0; -15 0" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Middle ring 1 -->
    <ellipse cx="100" cy="80" rx="42" ry="10" stroke="#CBD5E1" stroke-width="4.5" stroke-dasharray="50 25">
      <animateTransform attributeName="transform" type="translate" values="12 0; -12 0; 12 0" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Middle ring 2 -->
    <ellipse cx="100" cy="110" rx="30" ry="8" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="35 20">
      <animateTransform attributeName="transform" type="translate" values="-10 0; 10 0; -10 0" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Lower ring -->
    <ellipse cx="100" cy="140" rx="18" ry="6" stroke="#F1F5F9" stroke-width="3.5" stroke-dasharray="20 15">
      <animateTransform attributeName="transform" type="translate" values="8 0; -8 0; 8 0" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Vortex tip -->
    <circle cx="100" cy="165" r="5" fill="#F8FAFC">
      <animateTransform attributeName="transform" type="translate" values="-6 0; 6 0; -6 0" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
