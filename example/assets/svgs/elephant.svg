<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%">
  <style>
    .elephant-stroke {
      fill: none;
      stroke: #ffffff;
      stroke-width: 40;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- 全局呼吸缩放动画 (100% -> 90% -> 100%) -->
  <g id="scene-scale" transform-origin="540 540">
    <animateTransform
      attributeName="transform"
      type="scale"
      dur="2s"
      repeatCount="indefinite"
      values="1; 0.9; 1"
      keyTimes="0; 0.5; 1"
      keySplines="0.333 0 0.667 1; 0.333 0 0.667 1"
      calcMode="spline"
    />

    <!-- 静态底板圆角方块 (Layer 4) -->
    <rect
      x="252.36"
      y="252.36"
      width="575.28"
      height="575.28"
      rx="18.8"
      ry="18.8"
      fill="#194fe4"
      opacity="0.99"
    />

    <!-- 旋转方块组 (Layer 2 & Layer 3) -->
    <g id="rotating-card" transform-origin="540 540">
      <animateTransform
        attributeName="transform"
        type="rotate"
        dur="2s"
        repeatCount="indefinite"
        values="0; 45; 45; 90"
        keyTimes="0; 0.4286; 0.5714; 1"
        keySplines="0.333 0 0.667 1; 0 0 1 1; 0.333 0 0.667 1"
        calcMode="spline"
      />
      <!-- 半透明蓝灰填充块 (Layer 3) -->
      <rect
        x="234"
        y="234"
        width="612"
        height="612"
        rx="20"
        ry="20"
        fill="#cae1eb"
        opacity="0.42"
      />
      <!-- 浅蓝描边轮廓 (Layer 2) -->
      <rect
        x="234"
        y="234"
        width="612"
        height="612"
        rx="20"
        ry="20"
        fill="none"
        stroke="#b4d3ff"
        stroke-width="7"
        opacity="0.5"
      />
    </g>

    <!-- 大象角色图层 (comp_1 整体缩放 58%) -->
    <g transform="translate(540, 540) scale(0.58) translate(-540, -540)">
