<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#090514"/>
  <!-- Galaxy rotating -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="16s" repeatCount="indefinite"/>
    <!-- Spiral Arm 1 -->
    <path d="M 100 100 Q 140 70, 160 100 T 130 160" fill="none" stroke="#C084FC" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <path d="M 100 100 Q 130 80, 150 100" fill="none" stroke="#F472B6" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <!-- Spiral Arm 2 -->
    <path d="M 100 100 Q 60 130, 40 100 T 70 40" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <path d="M 100 100 Q 70 120, 50 100" fill="none" stroke="#818CF8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Galactic Core -->
  <circle cx="100" cy="100" r="16" fill="#FDF4FF"/>
  <circle cx="100" cy="100" r="26" fill="#E879F9" opacity="0.4"/>
</svg>
