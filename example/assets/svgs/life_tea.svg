<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#1C1917"/>
  <!-- Straw -->
  <line x1="120" y1="30" x2="85" y2="160" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>
  <!-- Cup Body -->
  <polygon points="60,65 140,65 130,165 70,165" fill="#FED7AA" opacity="0.9"/>
  <!-- Cup Lid -->
  <ellipse cx="100" cy="65" rx="42" ry="8" fill="#F97316"/>
  <!-- Boba Pearls -->
  <g fill="#451A03">
    <circle cx="85" cy="148" r="7">
      <animate attributeName="cy" values="148;140;148" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="154" r="8">
      <animate attributeName="cy" values="154;146;154" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="148" r="7">
      <animate attributeName="cy" values="148;138;148" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
