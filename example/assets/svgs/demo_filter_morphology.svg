<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dilateEffect" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="200">
      <feMorphology operator="dilate" radius="3" />
    </filter>
    <filter id="erodeEffect" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="200">
      <feMorphology operator="erode" radius="2" />
    </filter>
  </defs>
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#0F172A" />
  <text x="90" y="96" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#38BDF8" filter="url(#dilateEffect)">
    BOLD
  </text>
  <text x="232" y="96" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#F472B6" filter="url(#erodeEffect)">
    THIN
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite" />
  </text>
  <text x="160" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#CBD5E1">
    &lt;feMorphology&gt; dilate / erode
  </text>
</svg>
