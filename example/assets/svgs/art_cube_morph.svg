<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Isometric Cube bouncing vertically -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" values="0 -14; 0 14; 0 -14" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Top Face -->
    <polygon points="100,55 145,80 100,105 55,80" fill="#38BDF8"/>
    <!-- Left Face -->
    <polygon points="55,80 100,105 100,155 55,130" fill="#0284C7"/>
    <!-- Right Face -->
    <polygon points="100,105 145,80 145,130 100,155" fill="#0369A1"/>
  </g>
</svg>
