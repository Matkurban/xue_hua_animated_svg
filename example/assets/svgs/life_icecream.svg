<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#2E1065"/>
  <!-- Melting Drop -->
  <circle cx="75" cy="115" r="3.5" fill="#F472B6">
    <animate attributeName="cy" values="105;155" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Waffle Cone -->
  <polygon points="68,110 132,110 100,180" fill="#D97706"/>
  <line x1="80" y1="125" x2="115" y2="145" stroke="#B45309" stroke-width="2"/>
  <line x1="120" y1="125" x2="85" y2="145" stroke="#B45309" stroke-width="2"/>
  <!-- Ice Cream Scoops bobbing -->
  <g transform-origin="100 80">
    <animateTransform attributeName="transform" type="rotate" values="-3 100 80; 3 100 80; -3 100 80" dur="2s" repeatCount="indefinite"/>
    <!-- Scoop 1 (Pink) -->
    <circle cx="100" cy="95" r="30" fill="#F472B6"/>
    <!-- Scoop 2 (Mint) -->
    <circle cx="100" cy="65" r="25" fill="#34D399"/>
    <!-- Cherry on top -->
    <circle cx="100" cy="38" r="8" fill="#E11D48"/>
  </g>
</svg>
