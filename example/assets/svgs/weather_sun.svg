<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Ray group rotating -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
    <line x1="100" y1="30" x2="100" y2="46" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="154" x2="100" y2="170" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="46" y2="100" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="154" y1="100" x2="170" y2="100" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="62" y2="62" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="138" y1="138" x2="150" y2="150" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="150" x2="62" y2="138" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <line x1="138" y1="62" x2="150" y2="50" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Pulsing corona -->
  <circle cx="100" cy="100" r="42" fill="#FDE68A" opacity="0.3">
    <animate attributeName="r" values="38;46;38" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Core Sun -->
  <circle cx="100" cy="100" r="32" fill="url(#sunGrad)"/>
</svg>
