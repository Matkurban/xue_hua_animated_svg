<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="200">
      <feDropShadow dx="10" dy="12" stdDeviation="6" flood-color="#0EA5E9" flood-opacity="0.7" />
    </filter>
  </defs>
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#0F172A" />
  <rect x="76" y="42" width="168" height="94" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" filter="url(#cardShadow)">
    <animate attributeName="y" values="46;36;46" dur="2.4s" repeatCount="indefinite" />
  </rect>
  <text x="160" y="90" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">
    Drop Shadow
  </text>
  <text x="160" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#7DD3FC">
    &lt;filter&gt; + &lt;feDropShadow&gt;
  </text>
</svg>
