<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0A0E1A"/>
  <!-- Exhaust Flame -->
  <g>
    <path d="M 92 135 C 92 165, 100 185, 100 185 C 100 185, 108 165, 108 135 Z" fill="#EF4444">
      <animateTransform attributeName="transform" type="scale" values="1 0.85; 1 1.25; 1 0.85" dur="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M 95 135 C 95 155, 100 170, 100 170 C 100 170, 105 155, 105 135 Z" fill="#FACC15">
      <animateTransform attributeName="transform" type="scale" values="1 0.9; 1 1.2; 1 0.9" dur="0.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Rocket Body vibrating -->
  <g transform-origin="100 80">
    <animateTransform attributeName="transform" type="translate" values="-0.5 -1; 0.5 1; -0.5 -1" dur="0.15s" repeatCount="indefinite"/>
    <!-- Fins -->
    <polygon points="80,110 65,135 85,135" fill="#DC2626"/>
    <polygon points="120,110 135,135 115,135" fill="#DC2626"/>
    <!-- Fuselage -->
    <path d="M 100 35 C 85 65, 82 110, 82 135 L 118 135 C 118 110, 115 65, 100 35 Z" fill="#E2E8F0"/>
    <!-- Porthole -->
    <circle cx="100" cy="78" r="11" fill="#0284C7"/>
    <circle cx="100" cy="78" r="8" fill="#38BDF8"/>
  </g>
</svg>
