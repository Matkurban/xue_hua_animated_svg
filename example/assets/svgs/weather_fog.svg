<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#1E293B"/>
  <!-- Fog band 1 -->
  <path d="M 10 65 Q 60 55, 100 65 T 190 65" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="-15 0; 15 0; -15 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- Fog band 2 -->
  <path d="M 20 95 Q 70 105, 110 95 T 180 95" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="20 0; -20 0; 20 0" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <!-- Fog band 3 -->
  <path d="M 15 125 Q 65 115, 105 125 T 185 125" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="-18 0; 18 0; -18 0" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <!-- Fog band 4 -->
  <path d="M 30 155 Q 75 165, 120 155 T 170 155" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="12 0; -12 0; 12 0" dur="3.8s" repeatCount="indefinite"/>
  </path>
</svg>
