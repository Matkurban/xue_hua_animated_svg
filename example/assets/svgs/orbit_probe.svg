  </defs>
  <circle cx="110" cy="110" r="80" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="110" cy="110" r="10" fill="#F59E0B"/>
  <g>
    <path d="M -10 -6 L 14 0 L -10 6 L -4 0 Z" fill="#F97316" stroke="#FFF7ED" stroke-width="1"/>
