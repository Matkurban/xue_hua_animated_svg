<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0B0F19"/>
  <!-- Crescent Moon rocking -->
  <g transform-origin="90 100">
    <animateTransform attributeName="transform" type="rotate" values="-8 90 100; 8 90 100; -8 90 100" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <path d="M 95 40 A 55 55 0 1 0 145 135 A 48 48 0 1 1 95 40 Z" fill="#FDE047"/>
    <circle cx="68" cy="95" r="7" fill="#FACC15" opacity="0.4"/>
    <circle cx="85" cy="130" r="5" fill="#FACC15" opacity="0.4"/>
  </g>
  <!-- Star 1 -->
  <polygon points="150,50 153,58 161,61 153,64 150,72 147,64 139,61 147,58" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <!-- Star 2 -->
  <polygon points="45,45 47,51 53,53 47,55 45,61 43,55 37,53 43,51" fill="#BAE6FD">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </polygon>
  <!-- Star 3 -->
  <polygon points="155,140 157,145 162,147 157,149 155,154 153,149 148,147 153,145" fill="#FDE047">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
  </polygon>
</svg>
