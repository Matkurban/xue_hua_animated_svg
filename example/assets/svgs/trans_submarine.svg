<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#022C22"/>
  <!-- Bubbles floating up -->
  <circle cx="155" cy="120" r="4" fill="#6EE7B7" opacity="0.8">
    <animate attributeName="cy" values="120;60" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="125" r="3" fill="#6EE7B7" opacity="0.8">
    <animate attributeName="cy" values="125;70" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Submarine Hull bobbing -->
  <g transform-origin="100 115">
    <animateTransform attributeName="transform" type="translate" values="0 -4; 0 4; 0 -4" dur="2.8s" repeatCount="indefinite"/>
    <!-- Conning tower -->
    <rect x="85" y="75" width="28" height="25" rx="5" fill="#059669"/>
    <line x1="95" y1="75" x2="95" y2="60" stroke="#059669" stroke-width="4"/>
    <line x1="95" y1="60" x2="102" y2="60" stroke="#059669" stroke-width="4"/>
    <!-- Hull Body -->
    <ellipse cx="95" cy="115" rx="60" ry="22" fill="#10B981"/>
    <!-- Portholes -->
    <circle cx="70" cy="115" r="6" fill="#FEF08A"/>
    <circle cx="95" cy="115" r="6" fill="#FEF08A"/>
    <circle cx="120" cy="115" r="6" fill="#FEF08A"/>
    <!-- Propeller -->
    <polygon points="155,108 160,115 155,122" fill="#047857"/>
  </g>
</svg>
