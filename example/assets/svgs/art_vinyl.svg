<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#262626"/>
  <!-- Turntable Deck -->
  <rect x="30" y="30" width="140" height="140" rx="14" fill="#171717" stroke="#404040" stroke-width="3"/>
  <!-- Spinning Vinyl Disc -->
  <g transform-origin="90 100">
    <animateTransform attributeName="transform" type="rotate" from="0 90 100" to="360 90 100" dur="3s" repeatCount="indefinite"/>
    <!-- Black vinyl grooves -->
    <circle cx="90" cy="100" r="52" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
    <circle cx="90" cy="100" r="42" fill="none" stroke="#262626" stroke-width="2"/>
    <circle cx="90" cy="100" r="32" fill="none" stroke="#262626" stroke-width="2"/>
    <!-- Label -->
    <circle cx="90" cy="100" r="18" fill="#F43F5E"/>
    <circle cx="90" cy="100" r="4" fill="#FFFFFF"/>
  </g>
  <!-- Tonearm rocking -->
  <g transform-origin="150 50">
    <animateTransform attributeName="transform" type="rotate" values="-2 150 50; 4 150 50; -2 150 50" dur="4s" repeatCount="indefinite"/>
    <circle cx="150" cy="50" r="10" fill="#737373"/>
    <line x1="150" y1="50" x2="125" y2="105" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <rect x="118" y="103" width="14" height="8" rx="2" fill="#E11D48"/>
  </g>
</svg>
