<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maskFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <mask id="punchMask" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="200">
      <rect x="40" y="34" width="240" height="116" rx="18" fill="url(#maskFade)" />
      <circle cx="160" cy="92" r="28" fill="#000000">
        <animate attributeName="cx" values="95;225;95" dur="3s" repeatCount="indefinite" />
      </circle>
    </mask>
  </defs>
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#0F172A" />
  <rect x="40" y="34" width="240" height="116" rx="18" fill="#EC4899" mask="url(#punchMask)" />
  <text x="160" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#FBCFE8">
    &lt;mask&gt; luminance punch-out
  </text>
</svg>
