<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#042F2E"/>
  <!-- Breathing Halo Aura -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#2DD4BF" stroke-width="3" opacity="0.5">
    <animate attributeName="r" values="45;75;45" dur="3.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Yoga Meditator Silhouette -->
  <g fill="#5EEAD4">
    <!-- Head -->
    <circle cx="100" cy="65" r="14"/>
    <!-- Torso -->
    <path d="M 88 88 L 112 88 L 108 128 L 92 128 Z"/>
    <!-- Crossed Legs -->
    <path d="M 60 145 C 65 130, 135 130, 140 145 C 135 155, 65 155, 60 145 Z"/>
    <!-- Arms in namaste -->
    <path d="M 88 88 L 70 110 L 94 110" fill="none" stroke="#5EEAD4" stroke-width="6" stroke-linecap="round"/>
    <path d="M 112 88 L 130 110 L 106 110" fill="none" stroke="#5EEAD4" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
