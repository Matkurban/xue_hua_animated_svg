<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Background stars -->
  <circle cx="40" cy="150" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="160" cy="50" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="140" cy="170" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <!-- Dashing meteor -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80 -80; 120 120" dur="1.8s" repeatCount="indefinite"/>
    <!-- Tail -->
    <line x1="60" y1="60" x2="120" y2="120" stroke="url(#meteorTail)" stroke-width="5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="120" cy="120" r="5" fill="#FFFFFF"/>
    <circle cx="120" cy="120" r="9" fill="#F43F5E" opacity="0.5"/>
  </g>
</svg>
