<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#2E1065"/>
  <!-- Sparkle Particle 1 -->
  <polygon points="150,45 153,52 160,55 153,58 150,65 147,58 140,55 147,52" fill="#FDE047">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" repeatCount="indefinite"/>
  </polygon>
  <!-- Sparkle Particle 2 -->
  <polygon points="120,30 122,35 127,37 122,39 120,44 118,39 113,37 118,35" fill="#F472B6">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </polygon>
  <!-- Wand waving -->
  <g transform-origin="60 140">
    <animateTransform attributeName="transform" type="rotate" values="-8 60 140; 8 60 140; -8 60 140" dur="2s" repeatCount="indefinite"/>
    <!-- Shaft -->
    <line x1="60" y1="140" x2="135" y2="65" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
    <line x1="60" y1="140" x2="85" y2="115" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
    <!-- Star Tip -->
    <polygon points="135,50 140,62 152,65 143,73 146,85 135,78 124,85 127,73 118,65 130,62" fill="#FACC15"/>
  </g>
</svg>
