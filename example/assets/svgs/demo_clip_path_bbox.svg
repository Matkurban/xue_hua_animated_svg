<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <clipPath id="bboxReveal" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0" width="0.5" height="1" rx="0.12" ry="0.2">
        <animate attributeName="width" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="304" height="184" rx="18" fill="#0F172A" />
  <rect x="44" y="42" width="232" height="100" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <rect x="44" y="42" width="232" height="100" rx="16" fill="url(#clipGrad)" clip-path="url(#bboxReveal)" />
  <text x="160" y="92" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
    objectBoundingBox Clip
  </text>
  <text x="160" y="172" text-anchor="middle" font-family="monospace" font-size="14" fill="#94A3B8">
    &lt;clipPath&gt; dynamic reveal
  </text>
</svg>
