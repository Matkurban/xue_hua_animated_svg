<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#09090B"/>
  <!-- Clock Rim -->
  <circle cx="100" cy="100" r="70" fill="#18181B" stroke="#3F3F46" stroke-width="6"/>
  <!-- Hour Markers -->
  <circle cx="100" cy="42" r="3" fill="#A1A1AA"/>
  <circle cx="158" cy="100" r="3" fill="#A1A1AA"/>
  <circle cx="100" cy="158" r="3" fill="#A1A1AA"/>
  <circle cx="42" cy="100" r="3" fill="#A1A1AA"/>
  <!-- Minute Hand (Rotating in 12s) -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
    <line x1="100" y1="100" x2="100" y2="52" stroke="#F43F5E" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Second Hand (Rotating in 3s) -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite"/>
    <line x1="100" y1="112" x2="100" y2="45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Center Cap -->
  <circle cx="100" cy="100" r="5" fill="#FFFFFF"/>
</svg>
