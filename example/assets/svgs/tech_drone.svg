<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0F172A"/>
  <!-- Drone body bobbing -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="translate" values="0 -6; 0 6; 0 -6" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Diagonal Arms -->
    <line x1="60" y1="60" x2="140" y2="140" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="60" x2="60" y2="140" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <!-- Central Pod -->
    <rect x="85" y="85" width="30" height="30" rx="8" fill="#F8FAFC"/>
    <circle cx="100" cy="100" r="7" fill="#0284C7"/>
    <!-- Rotor 1 (TL) -->
    <g transform-origin="60 60">
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="0.2s" repeatCount="indefinite"/>
      <ellipse cx="60" cy="60" rx="20" ry="4" fill="#38BDF8"/>
    </g>
    <!-- Rotor 2 (TR) -->
    <g transform-origin="140 60">
      <animateTransform attributeName="transform" type="rotate" from="360 140 60" to="0 140 60" dur="0.2s" repeatCount="indefinite"/>
      <ellipse cx="140" cy="60" rx="20" ry="4" fill="#38BDF8"/>
    </g>
    <!-- Rotor 3 (BL) -->
    <g transform-origin="60 140">
      <animateTransform attributeName="transform" type="rotate" from="360 60 140" to="0 60 140" dur="0.2s" repeatCount="indefinite"/>
      <ellipse cx="60" cy="140" rx="20" ry="4" fill="#38BDF8"/>
    </g>
    <!-- Rotor 4 (BR) -->
    <g transform-origin="140 140">
      <animateTransform attributeName="transform" type="rotate" from="0 140 140" to="360 140 140" dur="0.2s" repeatCount="indefinite"/>
      <ellipse cx="140" cy="140" rx="20" ry="4" fill="#38BDF8"/>
    </g>
  </g>
</svg>
