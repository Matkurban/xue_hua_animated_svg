<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#030712"/>
  <!-- Tractor Beam -->
  <polygon points="100,85 50,185 150,185" fill="#10B981" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="1.8s" repeatCount="indefinite"/>
  </polygon>
  <!-- UFO body bobbing -->
  <g transform-origin="100 80">
    <animateTransform attributeName="transform" type="translate" values="0 -8; 0 8; 0 -8" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Dome -->
    <path d="M 80 75 A 20 20 0 0 1 120 75 Z" fill="#38BDF8" opacity="0.85"/>
    <!-- Saucer rim -->
    <ellipse cx="100" cy="80" rx="50" ry="14" fill="#64748B"/>
    <ellipse cx="100" cy="78" rx="42" ry="10" fill="#94A3B8"/>
    <!-- Flashing beacon lights -->
    <circle cx="70" cy="82" r="3" fill="#FACC15">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="84" r="3" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="82" r="3" fill="#EF4444">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
