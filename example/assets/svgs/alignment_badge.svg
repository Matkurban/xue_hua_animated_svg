<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 70" width="110" height="70">
  <!-- 小尺寸徽章 (110x70)：小于 320x200 预览框，配合 BoxFit.scaleDown 可同时在水平(左/中/右)与垂直(上/中/下)九宫格全方向移动 -->
  <rect x="3" y="3" width="104" height="64" rx="14" ry="14"
    fill="#1E1B4B" stroke="#38BDF8" stroke-width="3">
    <animate attributeName="stroke" values="#38BDF8;#F472B6;#34D399;#38BDF8" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- 中心旋转准星 -->
  <g transform="translate(55, 35)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="4s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="12 8" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
    </g>
    <circle cx="0" cy="0" r="5" fill="#34D399">
      <animate attributeName="r" values="3.5;7;3.5" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
