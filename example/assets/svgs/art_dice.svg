<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#064E3B"/>
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" values="-12 100 100; 12 100 100; -12 100 100" dur="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <!-- Dice Cube Base -->
    <rect x="55" y="55" width="90" height="90" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
    <!-- Five Dots pattern -->
    <circle cx="75" cy="75" r="7" fill="#EF4444"/>
    <circle cx="125" cy="75" r="7" fill="#0F172A"/>
    <circle cx="100" cy="100" r="9" fill="#EF4444"/>
    <circle cx="75" cy="125" r="7" fill="#0F172A"/>
    <circle cx="125" cy="125" r="7" fill="#EF4444"/>
  </g>
</svg>
