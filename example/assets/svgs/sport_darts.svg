<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#0C1B2A"/>
  <!-- Dartboard concentric rings -->
  <circle cx="100" cy="100" r="70" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="#EF4444" stroke-width="8" stroke-dasharray="32 10"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#22C55E" stroke-width="8" stroke-dasharray="22 8"/>
  <!-- Bullseye -->
  <circle cx="100" cy="100" r="16" fill="#22C55E"/>
  <circle cx="100" cy="100" r="8" fill="#EF4444"/>
  <!-- Vibrating Dart hitting center -->
  <g transform-origin="100 100">
    <animateTransform attributeName="transform" type="rotate" values="-4 100 100; 4 100 100; -4 100 100" dur="0.2s" repeatCount="indefinite"/>
    <!-- Flight feathers -->
    <polygon points="145,55 130,70 120,60" fill="#FACC15"/>
    <polygon points="145,55 130,40 140,50" fill="#FACC15"/>
    <!-- Shaft -->
    <line x1="100" y1="100" x2="135" y2="65" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
