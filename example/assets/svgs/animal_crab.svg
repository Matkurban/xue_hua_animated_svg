<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="20" fill="#1E293B"/>
  <g transform-origin="100 110">
    <animateTransform attributeName="transform" type="translate" values="-8 0; 8 0; -8 0" dur="1.4s" repeatCount="indefinite"/>
    <!-- Walking Legs Left -->
    <line x1="70" y1="120" x2="45" y2="135" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="110" x2="40" y2="115" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Walking Legs Right -->
    <line x1="130" y1="120" x2="155" y2="135" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="110" x2="160" y2="115" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Left Claw Snapping -->
    <g transform-origin="55 80">
      <animateTransform attributeName="transform" type="rotate" values="-15 55 80; 15 55 80; -15 55 80" dur="0.8s" repeatCount="indefinite"/>
      <line x1="75" y1="95" x2="55" y2="80" stroke="#DC2626" stroke-width="6"/>
      <circle cx="48" cy="72" r="12" fill="#EF4444"/>
    </g>
    <!-- Right Claw Snapping -->
    <g transform-origin="145 80">
      <animateTransform attributeName="transform" type="rotate" values="15 145 80; -15 145 80; 15 145 80" dur="0.8s" repeatCount="indefinite"/>
      <line x1="125" y1="95" x2="145" y2="80" stroke="#DC2626" stroke-width="6"/>
      <circle cx="152" cy="72" r="12" fill="#EF4444"/>
    </g>
    <!-- Crab Carapace Body -->
    <ellipse cx="100" cy="115" rx="35" ry="24" fill="#DC2626"/>
    <!-- Stalk Eyes -->
    <circle cx="88" cy="95" r="5" fill="#FFFFFF"/>
    <circle cx="88" cy="95" r="2.5" fill="#0F172A"/>
    <circle cx="112" cy="95" r="5" fill="#FFFFFF"/>
    <circle cx="112" cy="95" r="2.5" fill="#0F172A"/>
  </g>
</svg>
